[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metamodeler"
version = "0.1.0"
description = "CLI-first metamodeling scaffold"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pydantic>=2,<3"]

[project.scripts]
mm = "metamodeler.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
