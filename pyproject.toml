[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-metamodeling"
version = "0.1.0"
description = "CLI-first metamodeling scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "requests>=2,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
# Framework feature: PyMC GP surrogate backend (T5, T7, T8, T9 use this).
pymc = ["arviz>=0.17,<1", "pymc>=5,<6"]
# Framework feature: SBI NPE surrogate backend (T6 uses this).
# sbi 0.22..0.26+ supported via two compat layers in the backend:
# (1) `_build_sbi_inference` tries the new `tracker=` kwarg, then the legacy
#     `summary_writer=`, then no-logger — handles the kwarg rename in 0.26;
# (2) `_TrackerCompatWriter` adapts a `tensorboard.SummaryWriter` to expose
#     the `log_metric()` method the new sbi training loop calls.
# Together these let one wheel work across the full supported sbi range.
sbi = ["sbi>=0.22,<1", "torch>=2,<3"]
# Tutorial-only extras (NOT framework runtime). Required to *execute* the
# Jupyter notebooks in `tutorials/`; not needed if you're using the package
# from your own scripts. `numpy` is here defensively (transitive via scipy
# but pinned for tutorial-cell stability). `nbclient`/`nbconvert` are
# explicit because the bare `jupyter` metapackage doesn't always pull them
# transitively in conda envs that were created kernel-only (e.g. starting
# from `ipykernel` and adding pieces) — without them, `jupyter execute`
# (the verification path) is missing.
tutorials = [
    "jupyter>=1",
    "nbclient>=0.8",
    "nbconvert>=7",
    "notebook>=6",
    "matplotlib>=3.7",
    "numpy>=1.25",
]
# Tutorial-2-only extras: BioModels SBML simulator (libRoadRunner + tellurium).
# Required only if you want `bayesmm run` to actually execute SBML models
# (Tutorial 2). The `bayesmm` CLI itself does not require it; you can
# validate/plan a BioModels spec without these installed.
biomodels = ["libroadrunner>=2.5", "tellurium>=2.2"]
# Convenience union — install everything (framework + both backends + tutorial
# infrastructure + BioModels). Use this if you want every tutorial to run.
all = [
    "arviz>=0.17,<1",
    "pymc>=5,<6",
    "sbi>=0.22,<1",
    "torch>=2,<3",
    "jupyter>=1",
    "nbclient>=0.8",
    "nbconvert>=7",
    "notebook>=6",
    "matplotlib>=3.7",
    "numpy>=1.25",
    "libroadrunner>=2.5",
    "tellurium>=2.2",
]

[project.scripts]
bayesmm = "bayesian_metamodeling.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
# `projects/` holds research submodules with their own lifecycle and lint
# conventions — root config governs the framework only (see CLAUDE.md
# "Submodule Boundary"). This mirrors `testpaths = tests` in pytest.ini.
# `*.md` keeps `ruff format` out of fenced code blocks in design docs — the
# pre-commit hook runs it in-place, which would silently rewrite prose files.
extend-exclude = ["*.ipynb", "*.md", "projects/"]

[tool.ruff.lint]
select = ["E", "F", "I"]
