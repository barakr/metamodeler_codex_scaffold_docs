[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metamodeler"
version = "0.1.0"
description = "CLI-first metamodeling scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "requests>=2,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
pymc = ["arviz>=0.17,<1", "pymc>=5,<6"]
sbi = ["sbi>=0.22,<1", "torch>=2,<3"]

[project.scripts]
mm = "metamodeler.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
