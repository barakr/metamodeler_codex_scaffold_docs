name: CI

# Cross-platform verification for the `bayesian_metamodeling` package.
# The projects/tcr_signaling submodule is intentionally NOT built or tested here:
# it has a native (CMake/Metal) build with its own pytest config and is verified
# separately on macOS. This workflow proves the pure-Python package works on
# Windows, Linux, and macOS on every push.

on:
  push:
    branches: ["**"]
  pull_request:
  # Weekly drift check. The optional backends install from open ranges
  # (`pymc>=5,<6`, `torch>=2,<3`, `arviz>=0.17,<1`), so a new upstream release
  # can turn this red with no commit here. That is exactly how sbi 0.27 broke
  # CI unnoticed for ~3 months in 2026 — the last green run was in May and
  # nobody pushed until August. A scheduled run surfaces drift while it is one
  # version old instead of four. Mondays, 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    env:
      # PyMC/PyTensor needs a system BLAS to compile its C ops; in
      # toolchain-limited environments (and for deterministic CI across all
      # three OSes) fall back to PyTensor's C-less mode — see README.
      PYTENSOR_FLAGS: cxx=

    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with optional backends + test tooling
        # pytest / ruff are dev tools, not runtime deps — install them explicitly.
        run: python -m pip install --upgrade pip && python -m pip install -e ".[pymc,sbi]" pytest ruff

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format check
        run: python -m ruff format --check src tests

      - name: Run fast test suite
        run: python -m pytest -q -ra --tb=short -m "not slow" tests --junit-xml=fast-results.xml

      - name: Surface failures as annotations
        # Actions *logs* need an authenticated token to fetch; *annotations* are
        # readable on a public repo without one. Without this, a Windows-only
        # failure here reports nothing but "exit code 1" — which is exactly the
        # position this workflow left us in, on a matrix leg that cannot be
        # reproduced locally from a Mac.
        if: always()
        run: |
          python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          try:
              root = ET.parse("fast-results.xml").getroot()
          except Exception as exc:
              print(f"::error::could not read fast-results.xml: {exc}")
              sys.exit(0)
          suite = root.find("testsuite")
          if suite is None:
              suite = root
          total = int(suite.get("tests", 0)); skipped = int(suite.get("skipped", 0))
          failures = int(suite.get("failures", 0)); errors = int(suite.get("errors", 0))
          print(f"total={total} passed={total-skipped-failures-errors} "
                f"skipped={skipped} failed={failures} errors={errors}")
          lines = [f"| total | passed | skipped | failed | errors |", "|---|---|---|---|---|",
                   f"| {total} | {total-skipped-failures-errors} | {skipped} | {failures} | {errors} |", ""]
          for case in suite.iter("testcase"):
              name = f"{case.get('classname','').split('.')[-1]}::{case.get('name')}"
              for tag in ("failure", "error"):
                  for node in case.findall(tag):
                      msg = ((node.get("message") or "") + " " + (node.text or "")).replace("\n", " ")
                      msg = msg if len(msg) <= 900 else f"{msg[:450]} ... [snip] ... {msg[-450:]}"
                      print(f"::error title=fast suite {tag}::{name} :: {msg}")
                      lines.append(f"- **{name}** — `{msg[:300]}`")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")
          PY

      - name: bayesmm doctor smoke
        run: |
          python -m bayesian_metamodeling.cli.main doctor
          python -m bayesian_metamodeling.cli.main doctor --json
          python -m bayesian_metamodeling.cli.main setup --non-interactive --backend pymc,sbi
