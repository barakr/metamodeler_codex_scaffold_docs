name: Deep CI

# Fourth signal. `CI` runs `-m "not slow"` on every push, which by construction
# never executes the slow suite — so the tutorial integration test, the thing
# that actually runs all ten notebooks end to end, had never run in CI at all.
# Tutorials 5 and 9 were broken in the documented main env and nothing noticed.
#
# Separate workflow, not a job inside CI: this is minutes long and installs
# heavy backends, so it must not gate every push, and a failure here should not
# redden the push signal.
#
# The distinguishing feature of this job is REQUIRE_TUTORIAL_BACKENDS=1. Every
# backend-gated tutorial degrades to a clean "SKIPPED" path when its backend is
# missing and still reports its self-check OK — correct for a learner, useless
# as verification. That flag turns any such skip into a failure, so this job
# cannot go green while the science is being skipped.

on:
  schedule:
    # Nightly, 03:00 UTC. Tutorials are user-facing, and a break that sat for a
    # week would be found by a learner before it was found by CI.
    - cron: "0 3 * * *"

  # Also on push — for two reasons, the second less obvious than the first.
  #
  # 1. These paths are the ones that actually break tutorials, so waiting until
  #    tonight to learn about it is needless.
  # 2. GitHub disables scheduled workflows in PUBLIC repos after 60 days of
  #    repository inactivity, emails the admins, and does NOT re-enable them on
  #    the next push — you must click Enable per workflow. That would leave a
  #    returning project with zero scheduled coverage precisely when
  #    dependencies have drifted most. Push triggers are never disabled, so this
  #    keeps a safety net after dormancy even if the crons are asleep.
  #
  # `src/**` is included deliberately: T5/T9 broke from backend behaviour, not
  # from notebook edits. That does mean this fires on most substantive pushes —
  # acceptable because Actions minutes are free on public repos, so the cost is
  # queue time, not money. Narrow the list if the noise outweighs that.
  push:
    branches: ["**"]
    paths:
      - "tutorials/**"
      - "src/**"
      - "tests/test_tutorial_integration.py"
      - "pyproject.toml"
      - "environment*.yml"
      - ".github/workflows/slow.yml"

  workflow_dispatch:

jobs:
  slow:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the documented conda envs, because a tutorial can be broken in
        # ONE env and fine in others — T5 and T9 crashed only in the backend-less
        # main env, which a single all-backends job would never have caught.
        #
        # `require_backends` is on only for `full`: the partial envs are meant to
        # skip their backend steps, so demanding no-skips there would fail by
        # construction. Those jobs prove tutorials DEGRADE correctly; `full`
        # proves the science RUNS.
        include:
          - label: "main env (no backends)"
            extras: "tutorials"
            require_backends: "0"
          - label: "pymc env"
            extras: "pymc,tutorials"
            require_backends: "0"
          - label: "sbi env"
            extras: "sbi,tutorials"
            require_backends: "0"
          - label: "full (all backends, no skips allowed)"
            extras: "pymc,sbi,tutorials,biomodels"
            require_backends: "1"
    env:
      # PyTensor needs a system BLAS to compile its C ops; the C-less mode keeps
      # this deterministic, matching the main CI workflow.
      PYTENSOR_FLAGS: cxx=
      REQUIRE_TUTORIAL_BACKENDS: ${{ matrix.require_backends }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (extras = ${{ matrix.extras }})
        # `biomodels` appears only in the full job: libroadrunner/tellurium are
        # PyPI-only, and Tutorial 2's BioModels sweep — the tutorial whose silent
        # failure prompted all of this — is otherwise exercised nowhere.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]" pytest

      - name: Report resolved backend versions
        # Printed so a drift-induced failure can be diagnosed from the log alone.
        run: |
          python - <<'PY'
          import importlib.metadata as md
          for p in ("pymc","arviz","sbi","torch","pytensor","libroadrunner","tellurium","numpy","scipy"):
              try:
                  print(f"{p:15} {md.version(p)}")
              except Exception:
                  print(f"{p:15} MISSING")
          PY

      - name: Run the slow suite (includes all 10 tutorials)
        run: python -m pytest -q -m slow --junit-xml=slow-results.xml

      - name: Assert the slow suite actually ran
        # Same guard as the KS model CI: a collapse to zero collected tests
        # would otherwise exit 0 and read as success.
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("slow-results.xml").getroot()
          s = root.find("testsuite")
          if s is None:
              s = root
          total = int(s.get("tests", 0)); skipped = int(s.get("skipped", 0))
          failures = int(s.get("failures", 0)); errors = int(s.get("errors", 0))
          passed = total - skipped - failures - errors
          print(f"total={total} passed={passed} skipped={skipped} failed={failures} errors={errors}")
          if total < 10:
              sys.exit(f"FAIL: only {total} slow tests collected; expected >=10 (the tutorials alone are 10).")
          print("OK: slow suite ran.")
          PY
