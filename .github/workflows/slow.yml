name: Deep CI

# Fourth signal. `CI` runs `-m "not slow"` on every push, which by construction
# never executes the slow suite — so the tutorial integration test, the thing
# that actually runs all ten notebooks end to end, had never run in CI at all.
# Tutorials 5 and 9 were broken in the documented main env and nothing noticed.
#
# Separate workflow, not a job inside CI: this is minutes long and installs
# heavy backends, so it must not gate every push, and a failure here should not
# redden the push signal.
#
# The distinguishing feature of this job is REQUIRE_TUTORIAL_BACKENDS=1. Every
# backend-gated tutorial degrades to a clean "SKIPPED" path when its backend is
# missing and still reports its self-check OK — correct for a learner, useless
# as verification. That flag turns any such skip into a failure, so this job
# cannot go green while the science is being skipped.

on:
  schedule:
    # Nightly, 03:00 UTC. Tutorials are user-facing, and a break that sat for a
    # week would be found by a learner before it was found by CI.
    - cron: "0 3 * * *"

  # Also on push — for two reasons, the second less obvious than the first.
  #
  # 1. These paths are the ones that actually break tutorials, so waiting until
  #    tonight to learn about it is needless.
  # 2. GitHub disables scheduled workflows in PUBLIC repos after 60 days of
  #    repository inactivity, emails the admins, and does NOT re-enable them on
  #    the next push — you must click Enable per workflow. That would leave a
  #    returning project with zero scheduled coverage precisely when
  #    dependencies have drifted most. Push triggers are never disabled, so this
  #    keeps a safety net after dormancy even if the crons are asleep.
  #
  # `src/**` is included deliberately: T5/T9 broke from backend behaviour, not
  # from notebook edits. That does mean this fires on most substantive pushes —
  # acceptable because Actions minutes are free on public repos, so the cost is
  # queue time, not money. Narrow the list if the noise outweighs that.
  push:
    branches: ["**"]
    paths:
      - "tutorials/**"
      - "src/**"
      # All of tests/, not just the tutorial file: this job runs the whole slow
      # suite, so any test it executes must be able to trigger it. Naming one
      # file meant a fix to tests/test_biomodels_slow.py — for a failure only
      # this job could see — did not re-run the job that would confirm it.
      - "tests/**"
      - "examples/biomodels/**"
      - "pyproject.toml"
      - "environment*.yml"
      - ".github/workflows/slow.yml"

  workflow_dispatch:

jobs:
  slow:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the documented conda envs, because a tutorial can be broken in
        # ONE env and fine in others — T5 and T9 crashed only in the backend-less
        # main env, which a single all-backends job would never have caught.
        #
        # `require_backends` is on only for `full`: the partial envs are meant to
        # skip their backend steps, so demanding no-skips there would fail by
        # construction. Those jobs prove tutorials DEGRADE correctly; `full`
        # proves the science RUNS.
        include:
          - label: "main env (no backends)"
            extras: "tutorials"
            require_backends: "0"
            mpi: "0"
            strict_skips: "0"
          - label: "pymc env"
            extras: "pymc,tutorials"
            require_backends: "0"
            mpi: "0"
            strict_skips: "0"
          - label: "sbi env"
            extras: "sbi,tutorials"
            require_backends: "0"
            mpi: "0"
            strict_skips: "0"
          - label: "full (all backends, no skips allowed)"
            extras: "pymc,sbi,tutorials,biomodels"
            require_backends: "1"
            # Only this job installs MPI, so test_mpi_sweep_integration actually
            # runs somewhere. It had never run anywhere: mpi4py is in no conda
            # env and was in no CI job.
            mpi: "1"
            # strict: in the job with everything installed, the ONLY sanctioned
            # skip is "submodule not checked out" (covered by Interface CI).
            # Anything else means a dependency is missing from the job.
            strict_skips: "1"
    env:
      # NOTE: unlike `CI` and `Submodule notebooks CI`, this job does NOT set
      # `PYTENSOR_FLAGS: cxx=`, and the difference is load-bearing.
      #
      # Without a C compiler PyTensor evaluates its graphs in pure Python. That is fine
      # for the fast suite's small fits, and catastrophic for Tutorial 7c: its NUTS run
      # evaluates a several-hundred-component Gaussian mixture at every leapfrog step,
      # which took over 10 minutes locally even at 400 draws and blew the notebook
      # runner's 600s per-cell timeout on three separate Deep CI runs.
      #
      # Reducing draws cannot fix it — the cost is per-evaluation, not per-draw. Letting
      # PyTensor compile brings 7c back to ~97s locally. If a runner ever lacks a
      # compiler or BLAS, PyTensor falls back to the Python path on its own and this job
      # will simply be slow again rather than wrong.
      REQUIRE_TUTORIAL_BACKENDS: ${{ matrix.require_backends }}
      # Same idea, for tests/test_joint_sampling_backends.py: in the `full` job an
      # absent surrogate backend is a failure, not a skip. Joint sampling touches each
      # backend through exactly one call (`log_prob`), so "it works" has to mean "it
      # was run against both" — pymc_gp alone was the entire coverage before.
      REQUIRE_JOINT_BACKENDS: ${{ matrix.require_backends }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MPI (full job only)
        # mpi4py needs a system MPI to build against; openmpi is the one the
        # ubuntu image can install cleanly. Without this the mpi sweep test skips
        # everywhere, which is how it went unrun since it was written.
        if: matrix.mpi == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopenmpi-dev openmpi-bin
          python -m pip install mpi4py
          mpiexec --version

      - name: Install (extras = ${{ matrix.extras }})
        # `biomodels` appears only in the full job: libroadrunner/tellurium are
        # PyPI-only, and Tutorial 2's BioModels sweep — the tutorial whose silent
        # failure prompted all of this — is otherwise exercised nowhere.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]" pytest

      - name: Report resolved backend versions
        # Printed so a drift-induced failure can be diagnosed from the log alone.
        run: |
          python - <<'PY'
          import importlib.metadata as md
          for p in ("pymc","arviz","sbi","torch","pytensor","libroadrunner","tellurium","numpy","scipy"):
              try:
                  print(f"{p:15} {md.version(p)}")
              except Exception:
                  print(f"{p:15} MISSING")
          PY

      - name: Run the slow suite (includes all 10 tutorials)
        run: python -m pytest -q -ra --tb=short -m slow --junit-xml=slow-results.xml

      - name: Run the MPI sweep test under mpirun (full job only)
        # Installing mpi4py is not sufficient: the test needs >=2 ranks, so under
        # a plain `pytest` it skips with "requires >=2 ranks" no matter what is
        # installed. It has to be LAUNCHED by mpirun. --oversubscribe because a
        # hosted runner may report fewer slots than ranks requested.
        if: matrix.mpi == '1'
        run: mpirun --oversubscribe -n 2 python -m pytest -q -m mpi

      - name: Dump per-point sweep errors on failure
        # A failed sweep reports only "N/N DOE points failed" — the actual
        # per-point exception goes to sweep_logs.jsonl, which is precisely the
        # asymmetry that let the original T2 silent failure survive. Surfacing it
        # as annotations makes a red run diagnosable from its URL, since Actions
        # logs need an authenticated token to fetch but annotations do not.
        if: failure()
        run: |
          python - <<'PY'
          import json, pathlib
          logs = sorted(pathlib.Path("tmp").rglob("sweep_logs.jsonl"))
          if not logs:
              print("::warning::no sweep_logs.jsonl found under tmp/")
          seen = set()
          for log in logs:
              for line in log.read_text(encoding="utf-8", errors="replace").splitlines():
                  try:
                      rec = json.loads(line)
                  except Exception:
                      continue
                  err = str(rec.get("error") or rec.get("stderr") or "").strip()
                  if not err:
                      continue
                  key = err[:200]
                  if key in seen:      # every point usually fails identically
                      continue
                  seen.add(key)
                  print(f"::error title=sweep point error ({log.parent.name})::{err[:900]}")
                  if len(seen) >= 5:
                      break
              if len(seen) >= 5:
                  break
          if not seen:
              print("::warning::sweep_logs.jsonl found but carried no error field")
          PY

      - name: Summarise result (and surface failures as annotations)
        # Two jobs. (1) The same collapse guard as KS model CI: zero collected
        # tests would otherwise exit 0 and read as success. (2) Emit each
        # failure as a `::error::` annotation and into the run summary.
        #
        # That second part is not cosmetic. Actions *logs* need an authenticated
        # token to fetch, but *annotations* are readable on a public repo without
        # one — so putting the failing test names and messages here is the
        # difference between diagnosing a red run from its URL and having to
        # reproduce it blind. Learned the hard way on the first matrix run.
        if: always()
        env:
          STRICT_SKIPS: ${{ matrix.strict_skips }}
          JOB_LABEL: ${{ matrix.label }}
        run: |
          python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET

          root = ET.parse("slow-results.xml").getroot()
          suite = root.find("testsuite")
          if suite is None:
              suite = root
          total = int(suite.get("tests", 0)); skipped = int(suite.get("skipped", 0))
          failures = int(suite.get("failures", 0)); errors = int(suite.get("errors", 0))
          passed = total - skipped - failures - errors
          print(f"total={total} passed={passed} skipped={skipped} failed={failures} errors={errors}")

          lines = [f"| total | passed | skipped | failed | errors |",
                   f"|---|---|---|---|---|",
                   f"| {total} | {passed} | {skipped} | {failures} | {errors} |", ""]

          bad = []
          for case in suite.iter("testcase"):
              for tag in ("failure", "error"):
                  for node in case.findall(tag):
                      name = f"{case.get('classname')}::{case.get('name')}"
                      raw = ((node.get("message") or "") + " " + (node.text or "")).replace("\n", " ")
                      # Head AND tail: for a notebook CellExecutionError the head
                      # names the cell and the tail carries the actual exception,
                      # and a head-only truncation cuts off exactly the useful part.
                      msg = raw if len(raw) <= 900 else f"{raw[:450]} ... [snip] ... {raw[-450:]}"
                      bad.append((name, msg))
                      # Annotation: readable without auth, unlike the log itself.
                      print(f"::error title=slow suite {tag}::{name} :: {msg}")

          if bad:
              lines.append("### Failures")
              for name, msg in bad:
                  lines.append(f"- **{name}**")
                  lines.append(f"  - `{msg}`")

          # Classify every skip against a registry of sanctioned reasons, so the
          # summary answers "is this skip fine, and why?" without anyone having
          # to reason it out. A bare count is unauditable: three jobs with
          # different backends once reported an identical "skipped: 8" and there
          # was no way to tell whether that was the same eight tests.
          #
          # (substring, short justification). Order matters only for display.
          SANCTIONED = [
              ("libroadrunner",  "biomodels extra not installed in this job (the `full` job has it)"),
              ("roadrunner",     "biomodels extra not installed in this job (the `full` job has it)"),
              ("mpi4py",         "MPI not installed in this job (the `full` job has it)"),
              ("mpiexec",        "MPI not installed in this job (the `full` job has it)"),
              ("both pymc and",  "needs pymc AND sbi together; only the `full` job has both"),
              ("submodule",      "submodule not checked out here by design — contracts covered by Interface CI, notebooks by Submodule notebooks CI"),
              (">=2 ranks",      "run separately under `mpirun -n 2` in this job; a plain pytest run cannot supply ranks"),
              ("BioModels refused", "biomodels.org returns 403 to hosted-runner IPs; the simulate path is covered via the vendored SBML"),
              ("needs pymc",     "pymc not installed in this job"),
              ("needs sbi",      "sbi not installed in this job"),
              ("needs torch",    "torch not installed in this job"),
          ]
          # In the fully-provisioned job, only the submodule skip is defensible.
          STRICT = os.environ.get("STRICT_SKIPS") == "1"
          STRICT_ALLOWED = ("submodule", ">=2 ranks", "biomodels refused")

          skips = []
          for case in suite.iter("testcase"):
              for node in case.findall("skipped"):
                  name = f"{case.get('classname', '').split('.')[-1]}::{case.get('name')}"
                  reason = (node.get("message") or node.text or "").replace("\n", " ").strip()
                  why = next((w for pat, w in SANCTIONED if pat.lower() in reason.lower()), None)
                  if why and STRICT and not any(p in reason.lower() for p in STRICT_ALLOWED):
                      why = None  # sanctioned in general, not in the full job
                  skips.append((name, reason[:200], why))

          unexpected = [s for s in skips if s[2] is None]
          if skips:
              lines.append("")
              lines.append(f"### Skipped ({len(skips)}) — {len(unexpected)} unexpected")
              lines.append("| verdict | test | reason | why that's OK |")
              lines.append("|---|---|---|---|")
              for name, reason, why in sorted(skips):
                  mark = "OK" if why else "**UNEXPECTED**"
                  lines.append(f"| {mark} | `{name}` | {reason} | {why or '— not a sanctioned reason'} |")

          for name, reason, _ in unexpected:
              print(f"::error title=unsanctioned skip::{name} skipped: {reason}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")

          if total < 10:
              sys.exit(f"FAIL: only {total} slow tests collected; expected >=10 (tutorials alone are 10).")
          if bad:
              sys.exit(f"FAIL: {len(bad)} slow test(s) failed — see annotations above.")
          if unexpected:
              sys.exit(
                  f"FAIL: {len(unexpected)} test(s) skipped for a reason not in the sanctioned "
                  f"registry. Either install the missing dependency in this job, or add the "
                  f"reason to SANCTIONED with a justification."
              )
          print(f"OK: slow suite ran clean; {len(skips)} sanctioned skip(s).")
          PY
