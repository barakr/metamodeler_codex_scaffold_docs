[pytest]
addopts = -q
# Only the bayesian_metamodeling test suite. The projects/tcr_signaling submodule
# has its own pytest.ini (with its own markers, e.g. `deterministic`) and must be
# tested from inside the submodule — collecting it here under `filterwarnings = error`
# turns its unknown-marker warning into a collection error.
testpaths = tests
markers =
    slow: tests that may exceed 30 seconds
    integration: end-to-end tests across multiple components
    contract: interface contract tests for adapters and runners
    optional_backend: tests that require optional backend dependencies (pymc and/or sbi)
    mpi: tests that require an MPI launcher and mpi4py
filterwarnings =
    error
