# PyMC surrogate-fitting environment (see CLAUDE.md "Conda Environments during
# development"). Kept separate from the main env because pinning PyMC, SBI and
# PyTorch in a single solve is fragile.
#
#   conda env create -f environment-pymc.yml && conda activate py312_bayesmm_pymc
#
# Referenced from specs as `{"execution_env": {"conda_env": "py312_bayesmm_pymc"}}`.
name: py312_bayesmm_pymc
channels:
  - conda-forge
dependencies:
  - python=3.12
  - python_abi=3.12.*=*_cp312
  - pip
  - pydantic>=2,<3
  - requests>=2,<3
  - scipy>=1.11,<2
  - numpy
  - matplotlib
  - pytest
  # Tracks pyproject's range rather than an exact version, so this env installs
  # what CI and users actually get. An exact pin here means testing something
  # nobody else runs; exact versions behind a published result belong in that
  # project's own Status.md, not in the framework's dev env.
  # Notebook execution, so the tutorials can be verified IN this env — CI's Deep
  # matrix tests each backend combination separately, and without nbclient here
  # `pytest -m slow tests/test_tutorial_integration.py` importorskips and reports
  # green having run nothing (rule 12).
  - jupyter
  - nbclient>=0.8
  - nbconvert>=7
  - ipykernel
  - pymc>=5,<6
  - arviz>=0.17,<1
  - pip:
      - -e .
